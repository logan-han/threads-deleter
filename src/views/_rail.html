<header class="rail">
  <a href="/">
    <svg class="mark" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
      <rect width="16" height="4" y="2"></rect><rect width="11" height="4" y="8"></rect>
    </svg>
    <b>threads deleter</b>
  </a>
  <button type="button" class="theme" id="theme" aria-label="Switch between light and dark">
    <svg class="moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5 5.8 5.8 0 1 0 13.5 9.6Z"></path></svg>
    <svg class="sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="3.1"></circle><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2 3.1 3.1"></path></svg>
  </button>
</header>
<script>
(function () {
  var button = document.getElementById('theme');
  var root = document.documentElement;
  if (!button) return;

  function current() {
    var set = root.getAttribute('data-theme');
    if (set) return set;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  button.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) { /* the page still switches, it just will not remember */ }
  });
})();
</script>
